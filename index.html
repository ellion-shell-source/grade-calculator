<!DOCTYPE html>
<html lang="uk" class="h-full font-sans antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Універсальний Калькулятор Балів</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200">
    <div class="min-h-full flex flex-col justify-between p-4 sm:p-6 lg:p-8 max-w-4xl mx-auto">
        
        <!-- Header -->
        <header class="flex justify-between items-center pb-6 border-b border-slate-200 dark:border-slate-800">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-brand-500 text-white rounded-xl shadow-md">
                    <i class="fa-solid fa-calculator text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Калькулятор Балів</h1>
                    <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">Переведення оцінок між будь-якими системами</p>
                </div>
            </div>
            <button id="themeToggleBtn" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all text-slate-600 dark:text-slate-300">
                <i class="fa-solid fa-moon text-lg dark:hidden"></i>
                <i class="fa-solid fa-sun text-lg hidden dark:block"></i>
            </button>
        </header>

        <!-- Main Content -->
        <main class="my-6 grid grid-cols-1 md:grid-cols-12 gap-6">
            
            <!-- Left Panel: Inputs -->
            <div class="md:col-span-7 space-y-6">
                
                <!-- Quick Presets -->
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-400 mb-3">
                        Швидкі пресети
                    </label>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="setPreset(5, 7)" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-700/60 hover:bg-brand-500 hover:text-white dark:hover:bg-brand-500 transition-all">5 / 7</button>
                        <button onclick="setPreset(8, 10)" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-700/60 hover:bg-brand-500 hover:text-white dark:hover:bg-brand-500 transition-all">8 / 10</button>
                        <button onclick="setPreset(18, 20)" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-700/60 hover:bg-brand-500 hover:text-white dark:hover:bg-brand-500 transition-all">18 / 20</button>
                        <button onclick="setPreset(85, 100)" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-700/60 hover:bg-brand-500 hover:text-white dark:hover:bg-brand-500 transition-all">85 / 100</button>
                    </div>
                </div>

                <!-- Main Form Inputs -->
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm space-y-5">
                    
                    <!-- Score / Max Score Input -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="scoreInput" class="block text-sm font-medium mb-1 text-slate-700 dark:text-slate-300">Отриманий бал</label>
                            <input type="number" id="scoreInput" step="any" min="0" placeholder="напр. 5" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-brand-500 outline-none font-semibold text-lg transition-all">
                        </div>
                        <div>
                            <label for="maxScoreInput" class="block text-sm font-medium mb-1 text-slate-700 dark:text-slate-300">Максимум</label>
                            <input type="number" id="maxScoreInput" step="any" min="0.1" placeholder="напр. 7" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-brand-500 outline-none font-semibold text-lg transition-all">
                        </div>
                    </div>

                    <!-- Target Scale Dropdown -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="targetScale" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Цільова шкала</label>
                            <button id="customRangesBtn" class="text-xs text-brand-600 dark:text-brand-400 hover:underline flex items-center gap-1 font-medium">
                                <i class="fa-solid fa-sliders"></i> Налаштувати рівні
                            </button>
                        </div>
                        <select id="targetScale" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-brand-500 outline-none font-medium transition-all">
                            <option value="3">3-бальна (1-3 бали)</option>
                            <option value="5">5-бальна (1-5 балів)</option>
                            <option value="12">12-бальна (1-12 балів)</option>
                            <option value="100">100-бальна (0-100 балів / %)</option>
                            <option value="custom">✏️ Кастомна шкала...</option>
                        </select>
                    </div>

                    <!-- Custom Scale Value Input (Hidden by default) -->
                    <div id="customScaleContainer" class="hidden transition-all duration-200">
                        <label for="customScaleInput" class="block text-sm font-medium mb-1 text-slate-700 dark:text-slate-300">Максимум кастомної шкали</label>
                        <input type="number" id="customScaleInput" step="any" min="1" placeholder="Вкажіть максимум, напр. 20" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-brand-500 outline-none font-medium transition-all">
                    </div>

                    <!-- Rounding Mode -->
                    <div>
                        <label for="roundingMode" class="block text-sm font-medium mb-1 text-slate-700 dark:text-slate-300">Округлення</label>
                        <select id="roundingMode" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-brand-500 outline-none font-medium transition-all">
                            <option value="1">До 1 десяткової (напр. 2.1)</option>
                            <option value="2">До 2 десяткових (напр. 2.14)</option>
                            <option value="0">До цілого числа (напр. 2)</option>
                            <option value="none">Без округлення (точний результат)</option>
                        </select>
                    </div>

                </div>
            </div>

            <!-- Right Panel: Output & Visuals -->
            <div class="md:col-span-5 flex flex-col gap-6">
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm flex-1 flex flex-col justify-between relative overflow-hidden">
                    
                    <!-- Result Header -->
                    <div>
                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-400">Результат</span>
                        <div class="mt-4 flex items-baseline gap-2">
                            <span id="resultValue" class="text-5xl sm:text-6xl font-black text-slate-900 dark:text-white tracking-tight">0</span>
                            <span id="resultScaleMax" class="text-xl font-semibold text-slate-400">/ 3</span>
                        </div>
                        
                        <!-- Dynamic Level Badge -->
                        <div class="mt-3">
                            <span id="levelBadge" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300">
                                Введіть бали
                            </span>
                        </div>
                    </div>

                    <!-- Progress Bar -->
                    <div class="my-6">
                        <div class="flex justify-between text-xs text-slate-400 font-medium mb-2">
                            <span>Успішність</span>
                            <span id="percentageText">0%</span>
                        </div>
                        <div class="w-full h-3 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden p-0.5">
                            <div id="progressBar" class="h-full bg-brand-500 rounded-full transition-all duration-300 w-0"></div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="pt-4 border-t border-slate-100 dark:border-slate-700/60 flex gap-2">
                        <button id="copyBtn" class="flex-1 py-2.5 px-4 rounded-xl border border-slate-200 dark:border-slate-700 font-medium text-sm hover:bg-slate-50 dark:hover:bg-slate-700 flex items-center justify-center gap-2 transition-all">
                            <i class="fa-regular fa-copy"></i>
                            <span id="copyText">Копіювати</span>
                        </button>
                    </div>

                </div>
            </div>

        </main>

        <!-- Footer -->
        <footer class="text-center text-xs text-slate-400 dark:text-slate-500 pt-4">
            Калькулятор оцінок &copy; 2026. Готовий для використання на GitHub Pages.
        </footer>
    </div>

    <!-- Custom Ranges Modal -->
    <div id="customRangesModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-200 dark:border-slate-700 space-y-4">
            <div class="flex justify-between items-center border-b pb-3 border-slate-100 dark:border-slate-700">
                <h3 class="font-bold text-lg text-slate-900 dark:text-white">Налаштування рівнів (%)</h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <p class="text-xs text-slate-500 dark:text-slate-400">Вкажіть мінімальний відсоток успішності для кожного рівня:</p>

            <div class="space-y-3" id="rangesList">
                <!-- Dynamic ranges will be inserted here -->
            </div>

            <div class="pt-3 flex justify-end gap-2 border-t border-slate-100 dark:border-slate-700">
                <button id="resetRangesBtn" class="px-4 py-2 text-xs font-medium text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200">Скинути</button>
                <button id="saveRangesBtn" class="px-4 py-2 text-xs font-medium bg-brand-500 hover:bg-brand-600 text-white rounded-xl shadow-sm">Зберегти</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
